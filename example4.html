
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Четвёртый пример</title>
</head>
<body>
    <h1>Форматирование текста</h1>

    <p>Это обычный текст.</p>

    <p>Это <strong>жирный текст</strong> внутри абзаца.</p>

    <p>Это <em>курсивный текст</em> внутри абзаца.</p>

    <p>Это <u>подчёркнутый текст</u> внутри абзаца.</p>
</body>
</html>
